# Esegue i test automatici a ogni push e pull request.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test di scheduler, unione dati, sincronizzazione e service worker
        run: node tests/run-node.mjs
